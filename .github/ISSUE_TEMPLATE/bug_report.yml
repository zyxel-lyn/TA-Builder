name: Bug report
description: Report a reproducible TA Builder problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a reproducible problem. Do not attach private academic documents, credentials, tokens, or signing material.

  - type: input
    id: version
    attributes:
      label: TA Builder version
      description: Example: v1.1.0
      placeholder: v1.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Project open/save
        - Document editor
        - BAB / structure
        - Preview
        - DOCX export
        - PDF export
        - Install / update
        - Recovery / versions
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove names, NPM/NIP, private document content, paths, tokens, and other sensitive information before posting.

  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed private documents, credentials, tokens, and personal/sensitive information from this report.
          required: true
